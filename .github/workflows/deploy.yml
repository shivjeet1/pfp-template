name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.146.0'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: /tmp/hugo_cache
        run: |
          # exampleSite/hugo.toml points themesDir at "../..", which only
          # resolves when the checkout folder is named "pfp-template".
          # Expose the theme under a stable path so the build never depends
          # on the repository directory name.
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/themes/pfp-template" \
            || { mkdir -p "$RUNNER_TEMP/themes"; \
                 ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/themes/pfp-template"; }
          cd exampleSite
          hugo \
            --minify \
            --themesDir "$RUNNER_TEMP/themes" \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./exampleSite/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
