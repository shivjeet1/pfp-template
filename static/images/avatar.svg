<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="indigoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="248" fill="url(#avatarBg)" stroke="url(#cyanAccent)" stroke-width="6" />

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="206" fill="none" stroke="url(#indigoAccent)" stroke-width="2" opacity="0.5" />

  <!-- Modern Tech / Code Monogram Polygon -->
  <g filter="url(#softGlow)" transform="translate(256, 256) scale(0.95) translate(-256, -256)">
    <!-- Left Bracket < -->
    <path d="M 180 180 L 110 256 L 180 332" fill="none" stroke="url(#cyanAccent)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Slash / -->
    <line x1="285" y1="160" x2="225" y2="352" stroke="url(#indigoAccent)" stroke-width="20" stroke-linecap="round" />

    <!-- Right Bracket > -->
    <path d="M 332 180 L 402 256 L 332 332" fill="none" stroke="url(#cyanAccent)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Accent Nodes -->
  <circle cx="256" cy="70" r="6" fill="#38BDF8" />
  <circle cx="442" cy="256" r="6" fill="#818CF8" />
  <circle cx="256" cy="442" r="6" fill="#38BDF8" />
  <circle cx="70" cy="256" r="6" fill="#818CF8" />
</svg>
