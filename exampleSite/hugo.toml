baseURL = "https://example.com/"
title = "Cid Kagenou"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true
locale = "en"

theme = "pfp-template"
themesDir = "../.."

[params]
  avatarAltText = "Cid Kagenou - Shadow Affliction Wielder"
  avatarURL = "/images/avatar.png"
  favicon = "/images/avatar-round-192.png"
  appleTouchIcon = "/images/avatar-180.png"
  heroScript = "/js/cid-shadow.js"
  heroMeta = "Shadow Affliction • Seventh-Rank Adventurer • Self-Declared Genius"

  showBackToTopButton = true

  # Custom CSS & Accent Color
  cssFiles = ["css/navbar.css", "css/skills.css"]
  accentColor = "#8B2FC9"

  description = "Shadow Magic, Existential Dread & The Death Of My Immortality Plan."
  author = "Cid Kagenou"
  metaKeywords = [
    "Shadow Magic",
    "Shadow Affliction",
    "Cid Kagenou",
    "Eminence in Shadow",
    "Adventurer",
    "Dark Fantasy",
    "Existential Crisis"
  ]

  footer = "All rights reserved. Built with Hugo Portfolio Template."

# Social icons in header, hero, and footer
socialIcons = [ 
  {name = "github", url = "https://github.com/username"},
  {name = "linkedin", url = "https://linkedin.com/in/username"},
  {name = "twitter", url = "https://x.com/username"},
  {name = "gmail", url = "mailto:cid@example.com"},
  {name = "rss", url = "/blogs/index.xml"}
]

[menu]
  [[menu.main]]
    name = "Home"
    url = "/#home"
    weight = 1

  [[menu.main]]
    name = "Projects"
    url = "/#projects"
    weight = 2

  [[menu.main]]
    name = "Blogs"
    url = "/#blogs"
    weight = 3

  [[menu.main]]
    name = "About"
    url = "/#about"
    weight = 4

  [[menu.main]]
    name = "Contact"
    url = "/#contact"
    weight = 5

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4
    ordered = false

[minify]
  minifyOutput = true
